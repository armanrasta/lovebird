[workspace]
members = [
    "crates/lovebird-common",
    "crates/lovebird-engine",
    "crates/lovebird-ct",
    "crates/lovebird-honeypot",
    "lovebird-server",
    "lovebird-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
regex = "1.11.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
sha2 = "0.10.9"
hex = "0.4.3"
clap = { version = "4.5.37", features = ["derive"] }
anyhow = "1.0.98"

[profile.release]
lto = true
codegen-units = 1
strip = true
