name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (harsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      - name: Clippy on lib/bins (harsh — no unwrap/panic)
        run: |
          cargo clippy --workspace --lib --bins --offline -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::dbg_macro \
            -D clippy::indexing_slicing \
            -D clippy::float_cmp \
            -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::doc_markdown \
            -A clippy::wildcard_imports \
            -A clippy::struct_excessive_bools \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::items_after_statements \
            -A clippy::uninlined_format_args
      - name: Clippy on tests (warnings denied, unwrap allowed)
        run: |
          cargo clippy --workspace --tests --offline -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::doc_markdown \
            -A clippy::wildcard_imports \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::uninlined_format_args \
            -A clippy::items_after_statements
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.toolchain }}
      - run: cargo fetch
      - run: cargo build --workspace --offline
      - run: cargo test --workspace --offline -- --nocapture
      - name: Stress suite
        run: cargo test -p lovebird-engine --offline stress_ -- --nocapture --test-threads=1

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      - run: cargo doc --workspace --offline --no-deps

  audit:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
        # Informational failures on yanked/unmaintained should still fail the build.
  cli-smoke:
    name: cli smoke (full)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      - name: Build CLI release-ish
        run: cargo build -p lovebird-cli --offline
      - name: Full CLI surface
        run: |
          set -euo pipefail
          BIN=target/debug/lovebird
          $BIN policy validate examples/policies/allow-admins.json
          $BIN policy lint examples/policies/allow-admins.json
          $BIN policy test examples/policies/allow-admins.json examples/scenarios/basic.json --explain
          $BIN policy dry-run examples/policies/allow-admins.json --against examples/traffic/sample.jsonl
          $BIN policy dry-run examples/policies/allow-admins.json --against examples/traffic/sample.jsonl --max-newly-denied 5
          $BIN policy diff examples/policies/allow-admins.json examples/policies/allow-admins.json
          $BIN policy shadow-report examples/policies/allow-admins.json examples/policies/allow-admins.json --against examples/traffic/sample.jsonl
          # Negative paths must fail
          ! $BIN policy validate /tmp/does-not-exist-lovebird.json
          ! $BIN policy dry-run examples/policies/allow-admins.json --against examples/traffic/sample.jsonl --max-newly-denied 0
