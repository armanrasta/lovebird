name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (harsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      - name: Clippy on lib/bins (harsh — no unwrap/panic)
        run: |
          cargo clippy --workspace --lib --bins --offline -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::dbg_macro \
            -D clippy::indexing_slicing \
            -D clippy::float_cmp \
            -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::doc_markdown \
            -A clippy::wildcard_imports \
            -A clippy::struct_excessive_bools \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::items_after_statements \
            -A clippy::uninlined_format_args
      - name: Clippy on tests (warnings denied, unwrap allowed)
        run: |
          cargo clippy --workspace --tests --offline -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -W clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::doc_markdown \
            -A clippy::wildcard_imports \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::uninlined_format_args \
            -A clippy::items_after_statements

  # Native GitHub-hosted OS matrix: Ubuntu, macOS, Windows
  test-os:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.toolchain }}
      - run: cargo fetch
      - run: cargo build --workspace --offline
      - run: cargo test --workspace --offline -- --nocapture
      - name: Stress suite
        run: cargo test -p lovebird-engine --offline stress_ -- --nocapture --test-threads=1

  # Real Debian (container on Ubuntu runner)
  test-debian:
    name: test (debian bookworm)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch
      - run: cargo build --workspace --offline
      - run: cargo test --workspace --offline -- --nocapture
      - run: cargo test -p lovebird-engine --offline stress_ -- --nocapture --test-threads=1

  # CentOS Stream 9 (RHEL-family stand-in; CentOS Linux is EOL)
  test-centos:
    name: test (centos stream9)
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - name: Install build deps
        run: |
          dnf -y install gcc make curl pkgconf-pkg-config git \
            openssl-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch
      - run: cargo build --workspace --offline
      - run: cargo test --workspace --offline -- --nocapture
      - run: cargo test -p lovebird-engine --offline stress_ -- --nocapture --test-threads=1

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      - run: cargo doc --workspace --offline --no-deps

  audit:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  cli-smoke:
    name: cli smoke (${{ matrix.os }})
    needs: [fmt, clippy, test-os]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.os }}
      - run: cargo fetch
      - run: cargo build -p lovebird-cli --offline
      - name: Full CLI surface
        run: bash scripts/ci-cli-smoke.sh
